<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algolence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,420;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D10;
    --bg-soft: #14171B;
    --text: #F2EFE8;
    --text-dim: #9A9A94;
    --accent: #B4915A;
    --line: rgba(242, 239, 232, 0.09);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
  }

  .field {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.55;
  }

  .field svg {
    width: 100%;
    height: 100%;
  }

  .field circle {
    fill: var(--accent);
  }

  .field line {
    stroke: var(--line);
    stroke-width: 1;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-10px, 8px); }
    100% { transform: translate(0, 0); }
  }

  .field g {
    animation: drift 26s ease-in-out infinite;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 24px;
  }

  .mark {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 420;
    font-size: clamp(2.6rem, 8vw, 4.6rem);
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1;
  }

  .rule {
    width: 44px;
    height: 1px;
    background: var(--accent);
    margin: 28px 0 26px;
    border: none;
  }

  .tagline {
    max-width: 34ch;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text-dim);
    margin: 0 0 44px;
  }

  form {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 380px;
  }

  input[type="email"] {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 13px 14px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  input[type="email"]::placeholder {
    color: var(--text-dim);
  }

  input[type="email"]:focus {
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: #1A1509;
    border: none;
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    padding: 13px 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s ease;
  }

  button:hover { opacity: 0.85; }

  .status {
    min-height: 20px;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 16px;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 28px 24px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.01em;
  }

  @media (max-width: 420px) {
    form { flex-direction: column; }
    button { width: 100%; }
    input[type="email"] { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .field g { animation: none; }
  }
</style>
</head>
<body>

<div class="field" aria-hidden="true">
  <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <g>
      <line x1="120" y1="140" x2="340" y2="260" />
      <line x1="340" y1="260" x2="260" y2="480" />
      <line x1="340" y1="260" x2="560" y2="200" />
      <line x1="560" y1="200" x2="720" y2="360" />
      <line x1="720" y1="360" x2="960" y2="300" />
      <line x1="720" y1="360" x2="820" y2="560" />
      <line x1="820" y1="560" x2="1040" y2="620" />
      <line x1="260" y1="480" x2="440" y2="620" />
      <line x1="960" y1="300" x2="1100" y2="160" />
      <circle cx="120" cy="140" r="2.5" />
      <circle cx="340" cy="260" r="3" />
      <circle cx="260" cy="480" r="2.5" />
      <circle cx="560" cy="200" r="2" />
      <circle cx="720" cy="360" r="3" />
      <circle cx="960" cy="300" r="2.5" />
      <circle cx="820" cy="560" r="2" />
      <circle cx="1040" cy="620" r="2.5" />
      <circle cx="440" cy="620" r="2" />
      <circle cx="1100" cy="160" r="2" />
    </g>
  </svg>
</div>

<main>
  <h1 class="mark">Algolence</h1>
  <hr class="rule">
  <p class="tagline">Software, systems, and infrastructure, built with care for teams that need it done right. We're putting the finishing touches on things.</p>

  <form id="notify-form">
    <input type="email" id="email-input" placeholder="you@company.com" required>
    <button type="submit">Notify me</button>
  </form>
  <p class="status" id="status"></p>
</main>

<footer>Algolence &middot; Lahore, Pakistan</footer>

<script>
  const form = document.getElementById('notify-form');
  const status = document.getElementById('status');
  const input = document.getElementById('email-input');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const value = input.value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    if (!valid) {
      status.textContent = 'Enter a valid email address.';
      return;
    }
    status.textContent = "You're on the list. We'll be in touch.";
    input.value = '';
  });
</script>

</body>
</html>
